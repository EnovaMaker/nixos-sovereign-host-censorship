[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-host-cli"
version = "0.1.0"
description = "nixos-sovereign-host CLI — status, health and management for a declarative self-hosting stack"
license = { text = "MIT" }
keywords = ["nixos", "nix", "self-hosting", "matrix", "syncthing", "backup"]
requires-python = ">=3.11"
dependencies = [
    "click>=8",
    "tabulate>=0.9",
]

[project.scripts]
sovereign = "sovereign_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.flake8]
max-line-length = 100
extend-ignore = "E203,W503"
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate:
    strategy:
      matrix:
        nixos-version: [ "nixos-24.05", "nixos-unstable" ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:${{ matrix.nixos-version }}
      - name: Evaluate module options
        run: |
          # modules/default.nix is a module function ({lib,config,pkgs,...}: {...}),
          # not an attrset, so it must be applied through lib.evalModules before
          # "options" exists on it — hasAttr on the raw function is a Nix error.
          # Found via an actual local run of this exact command, not assumed.
          nix-instantiate --eval --strict -E '
            let
              pkgs = import <nixpkgs> {};
              evaluated = pkgs.lib.evalModules {
                modules = [ (import ./modules) ];
                specialArgs = { inherit pkgs; };
              };
            in builtins.hasAttr "options" evaluated
          '
      - name: Check flake
        run: nix flake check --all-systems

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Build CLI
        run: nix build .#packages.x86_64-linux.sovereign-host-cli
      - name: Test CLI help
        run: |
          ./result/bin/sovereign --help
          ./result/bin/sovereign status --help

  nixos-tests:
    strategy:
      matrix:
        nixos-version: [ "nixos-24.05", "nixos-unstable" ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:${{ matrix.nixos-version }}
      - name: Run all tests
        run: nix flake check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Check Python CLI syntax
        run: python3 -m py_compile cli/src/sovereign_cli/*.py
